[package]
name = "pekswitcher"
description = "PekSwitcher — keyboard layout switcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The executable keeps the product's spelling: PekSwitcher.exe
[[bin]]
name = "PekSwitcher"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"
embed-resource = "3"

[dependencies]
# The software renderer keeps memory low; this small window needs no GPU.
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }
raw-window-handle = "0.6"
tray-icon = "0.26"
png = "0.18"
serde.workspace = true
serde_json.workspace = true
pek-core = { path = "../crates/pek-core" }
pek-platform = { path = "../crates/pek-platform" }
